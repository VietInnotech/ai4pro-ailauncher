[package]
name = "ai-launcher-tauri"
version = "0.1.1"
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2.7.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
